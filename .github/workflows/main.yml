name: GIMI ARM64 Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build GIMI ARM64 APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_COMPILE_SDK: "36"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "26.3.11579264"
      CMAKE_VERSION: "3.22.1"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 3. Android SDK
      #
      # IMPORTANT:
      # Do NOT install the old "tools" package.
      # It no longer exists.
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"


      # ============================================================
      # 4. Install Android SDK components
      # ============================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          echo
          echo "========================================"
          echo "Android SDK installed"
          echo "========================================"

          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android|build-tools|ndk;|cmake;" \
            || true


      # ============================================================
      # 5. Show environment
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set +e

          echo "===== JAVA ====="
          java -version

          echo
          echo "===== JAVAC ====="
          javac -version

          echo
          echo "===== CMAKE ====="
          cmake --version

          echo
          echo "===== NDK ====="
          ls -la "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          echo
          echo "===== SDK ROOT ====="
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "===== PROJECT ====="
          pwd
          find . -maxdepth 2 -type f | sort | head -200


      # ============================================================
      # 6. Remove duplicated Kotlin classes
      #
      # The uploaded project contains both:
      #
      # GimiNativeBridge.java
      # GimiNativeBridge.kt
      #
      # ModInfo.java
      # ModInfo.kt
      #
      # They define the same JVM classes.
      #
      # MainActivity.java already uses the Java versions,
      # so Java versions are kept.
      # ============================================================

      - name: Remove duplicate Kotlin JNI classes
        shell: bash
        run: |
          set -euxo pipefail

          rm -f \
            app/src/main/java/com/gimi/launcher/jni/GimiNativeBridge.kt

          rm -f \
            app/src/main/java/com/gimi/launcher/jni/ModInfo.kt

          echo "Remaining JNI source files:"
          find app/src/main/java/com/gimi/launcher/jni -type f -print


      # ============================================================
      # 7. Patch CMakeLists.txt
      #
      # Android build should produce:
      #
      # libgimi_arm64.so
      #
      # We don't need the native desktop test executables.
      # ============================================================

      - name: Patch CMake for Android
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("CMakeLists.txt")
          s = p.read_text()

          # --------------------------------------------------------
          # Disable desktop test executables when building Android.
          # --------------------------------------------------------

          start1 = s.find("# ─── Executable: Launcher Integration Tests")
          start2 = s.find("# ─── Executable: E2E Real Mod Tests")
          start3 = s.find("# ─── Shared Library Target")

          if start1 != -1 and start3 != -1:
              s = s[:start1] + s[start3:]

          # --------------------------------------------------------
          # Replace hardcoded Termux include paths.
          # --------------------------------------------------------

          s = s.replace(
              "    /usr/include\n"
              "    /data/data/com.termux/files/usr/include\n",
              ""
          )

          # --------------------------------------------------------
          # Add Android-specific handling.
          # --------------------------------------------------------

          marker = "project(gimi_arm64 VERSION 0.1.0 LANGUAGES C CXX)"

          addition = r'''
          
          # Android builds are produced through Gradle/NDK.
          if(ANDROID)
              message(STATUS "GIMI: Android/NDK build")
              message(STATUS "GIMI: ABI = ${ANDROID_ABI}")
              message(STATUS "GIMI: Platform = ${ANDROID_PLATFORM}")
          endif()
          '''

          if addition.strip() not in s:
              s = s.replace(marker, marker + addition, 1)

          p.write_text(s)

          print("CMakeLists.txt patched successfully.")
          PY

          echo
          echo "===== CMAKE TARGETS ====="
          grep -nE \
            "add_library|add_executable|target_link_libraries|ANDROID" \
            CMakeLists.txt || true


      # ============================================================
      # 8. Replace the old hybrid app/build.gradle
      #
      # The old version detects ARM64 host and runs
      # build_termux.sh.
      #
      # GitHub Actions is NOT Termux, so we use normal Gradle.
      # ============================================================

      - name: Configure Android Gradle project
        shell: bash
        run: |
          set -euxo pipefail

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }

          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GIMI-Launcher"

          include ":app"
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

          android.useAndroidX=true
          android.nonTransitiveRClass=true

          android.defaults.buildfeatures.buildconfig=true

          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.vfs.watch=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gimi.launcher'

              compileSdk 36

              defaultConfig {
                  applicationId "com.gimi.launcher"

                  minSdk 29
                  targetSdk 36

                  versionCode 4
                  versionName "1.2.0"

                  ndk {
                      abiFilters 'arm64-v8a'
                  }

                  externalNativeBuild {
                      cmake {
                          arguments \
                              "-DANDROID_STL=c++_static",
                              "-DCMAKE_CXX_STANDARD=20",
                              "-DCMAKE_BUILD_TYPE=Release"

                          targets "gimi_arm64"
                      }
                  }
              }

              buildTypes {
                  debug {
                      debuggable true
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "../CMakeLists.txt"
                      version "3.22.1"
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }

                  resources {
                      excludes += [
                          "META-INF/LICENSE*",
                          "META-INF/NOTICE*"
                      ]
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.13.1'

              implementation 'dev.rikka.shizuku:api:13.1.5'
              implementation 'dev.rikka.shizuku:provider:13.1.5'
          }
          EOF


      # ============================================================
      # 9. Fix Android Manifest
      # ============================================================

      - name: Normalize AndroidManifest
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()

          # AGP handles SDK versions through build.gradle.
          # Remove the explicit <uses-sdk> block to avoid
          # conflicting declarations.

          import re

          s = re.sub(
              r'\s*<uses-sdk\b[^>]*/>',
              '',
              s
          )

          p.write_text(s)

          print("AndroidManifest.xml normalized.")
          PY

          grep -n "uses-sdk" app/src/main/AndroidManifest.xml || true


      # ============================================================
      # 10. Make Gradle wrapper usable
      #
      # The repository contains the wrapper under android/.
      # We reuse it from the root project.
      # ============================================================

      - name: Configure Gradle wrapper
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x android/gradlew

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          s = p.read_text()

          s = s.replace(
              "gradle-8.5-rc-4-bin.zip",
              "gradle-8.2.2-bin.zip"
          )

          p.write_text(s)
          PY

          grep distributionUrl \
            android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 11. Verify Gradle project
      # ============================================================

      - name: Gradle project check
        shell: bash
        run: |
          set -euxo pipefail

          ./android/gradlew \
            -p . \
            tasks \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 12. Build ARM64 Debug APK
      # ============================================================

      - name: Build ARM64 Debug APK
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: |
          set -euxo pipefail

          ./android/gradlew \
            -p . \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ============================================================
      # 13. Find generated APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "APK files"
          echo "========================================"

          find app/build/outputs \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          echo
          echo "========================================"
          echo "Native libraries"
          echo "========================================"

          find app/build \
            -type f \
            -name "libgimi_arm64.so" \
            -print


      # ============================================================
      # 14. Verify APK contains ARM64 native library
      # ============================================================

      - name: Verify APK architecture
        shell: bash
        run: |
          set -euxo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
              echo "ERROR: APK not found."
              exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo
          echo "APK contents:"
          unzip -l "$APK" | grep -E \
            "lib/arm64-v8a|libgimi_arm64.so|AndroidManifest.xml" \
            || true

          echo
          echo "APK size:"
          ls -lh "$APK"


      # ============================================================
      # 15. APK Badging
      # ============================================================

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euxo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' | head -n 1)"

          "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" \
            dump badging "$APK" || true


      # ============================================================
      # 16. Upload APK
      # ============================================================

      - name: Upload GIMI ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: GIMI-Launcher-ARM64-Debug
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 17. Upload native library separately
      # ============================================================

      - name: Upload GIMI ARM64 native library
        uses: actions/upload-artifact@v4
        with:
          name: GIMI-libgimi-arm64
          path: |
            app/build/intermediates/cmake/**/obj/arm64-v8a/libgimi_arm64.so
          if-no-files-found: warn
          retention-days: 30
