name: GIMI ARM64 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Show tool versions
        run: |
          java -version
          ./gradlew --version || true
          $ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++ --version

      # 删除重复 Kotlin 类，保留 Java 实现
      - name: Remove duplicate Kotlin classes
        run: |
          rm -f app/src/main/java/com/gimi/launcher/jni/GimiNativeBridge.kt
          rm -f app/src/main/java/com/gimi/launcher/jni/ModInfo.kt

      # 修改 Gradle，让 Android Gradle Plugin 只构建 ARM64 native target
      - name: Configure Gradle native build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          old = """externalNativeBuild {
                  cmake {
                      path "../CMakeLists.txt"
                  }
              }"""

          new = """externalNativeBuild {
                  cmake {
                      path "../CMakeLists.txt"
                      version "3.22.1"
                      targets "gimi_arm64"
                  }
              }"""

          if old in s:
              s = s.replace(old, new)

          p.write_text(s)
          PY

      # 添加 Shizuku SDK
      - name: Add Shizuku dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          marker = """dependencies {"""

          dependency = """dependencies {
              implementation 'dev.rikka.shizuku:api:13.1.5'
              implementation 'dev.rikka.shizuku:provider:13.1.5'
          """

          if "dev.rikka.shizuku:api" not in s:
              s = s.replace(marker, dependency, 1)

          p.write_text(s)
          PY

      # 修正 Android SDK 版本
      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "compileSdk 34",
              "compileSdk 34"
          )

          s = s.replace(
              'targetSdk 34',
              'targetSdk 34'
          )

          p.write_text(s)
          PY

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Verify APK
        run: |
          echo "===== APK FILES ====="
          find app/build/outputs/apk -type f -print

          echo "===== NATIVE LIBRARY ====="
          find app/build -name "libgimi_arm64.so" -print

          echo "===== APK INFO ====="
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GIMI-Launcher-Android-ARM64
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: GIMI-libgimi-arm64
          path: |
            app/build/intermediates/cmake/**/obj/arm64-v8a/libgimi_arm64.so
          if-no-files-found: warn
