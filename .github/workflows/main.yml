name: GIMI ARM64 Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build GIMI ARM64 APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_COMPILE_SDK: "36"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "26.3.11579264"
      CMAKE_VERSION: "3.22.1"

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Java 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================================
      # 3. Android SDK
      #
      # IMPORTANT:
      # Do NOT install "tools".
      # The old Android SDK tools package no longer exists.
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"


      # ==========================================================
      # 4. Install Android SDK / NDK / CMake
      # ==========================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "Accept Android SDK licenses"
          echo "=========================================="

          yes | sdkmanager --licenses >/dev/null || true

          echo "=========================================="
          echo "Install SDK packages"
          echo "=========================================="

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          echo
          echo "=========================================="
          echo "Installed packages"
          echo "=========================================="

          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android|build-tools|ndk;|cmake;" \
            || true


      # ==========================================================
      # 5. Environment information
      # ==========================================================

      - name: Show build environment
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="
          java -version

          echo
          echo "=========================================="
          echo "JAVAC"
          echo "=========================================="
          javac -version

          echo
          echo "=========================================="
          echo "GRADLE ENVIRONMENT"
          echo "=========================================="
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          echo
          echo "=========================================="
          echo "NDK"
          echo "=========================================="
          ls -la \
            "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" \
            || true

          echo
          echo "=========================================="
          echo "CMAKE"
          echo "=========================================="
          cmake --version

          echo
          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="
          pwd

          find . -maxdepth 2 -type f \
            | sort \
            | head -300


      # ==========================================================
      # 6. Remove duplicated Kotlin classes
      #
      # Keep:
      #
      # GimiNativeBridge.java
      # ModInfo.java
      #
      # Remove duplicated Kotlin versions.
      # ==========================================================

      - name: Remove duplicate Kotlin classes
        shell: bash
        run: |
          set -euxo pipefail

          rm -f \
            app/src/main/java/com/gimi/launcher/jni/GimiNativeBridge.kt

          rm -f \
            app/src/main/java/com/gimi/launcher/jni/ModInfo.kt

          echo
          echo "Remaining JNI files:"
          find \
            app/src/main/java/com/gimi/launcher/jni \
            -type f \
            -print \
            || true


      # ==========================================================
      # 7. Patch CMakeLists.txt
      # ==========================================================

      - name: Patch CMake
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("CMakeLists.txt")

          if not p.exists():
              raise SystemExit("CMakeLists.txt not found")

          s = p.read_text()

          # ------------------------------------------------------
          # Remove desktop test executables.
          # Android should only build the shared library.
          # ------------------------------------------------------

          markers = [
              "# ─── Executable: Launcher Integration Tests",
              "# ─── Executable: E2E Real Mod Tests",
          ]

          shared_marker = "# ─── Shared Library Target"

          shared_pos = s.find(shared_marker)

          if shared_pos != -1:
              first_test = min(
                  [
                      x for x in
                      [s.find(m) for m in markers]
                      if x != -1
                  ],
                  default=-1
              )

              if first_test != -1 and first_test < shared_pos:
                  s = s[:first_test] + s[shared_pos:]

          # ------------------------------------------------------
          # Remove Termux-only include path.
          # ------------------------------------------------------

          s = s.replace(
              "/data/data/com.termux/files/usr/include",
              ""
          )

          # ------------------------------------------------------
          # Remove hardcoded /usr/include.
          # ------------------------------------------------------

          s = s.replace(
              "    /usr/include\n",
              ""
          )

          # ------------------------------------------------------
          # Add Android information.
          # ------------------------------------------------------

          project_marker = \
              "project(gimi_arm64 VERSION 0.1.0 LANGUAGES C CXX)"

          android_block = r'''

          # ======================================================
          # Android / NDK build
          # ======================================================

          if(ANDROID)
              message(STATUS "==========================================")
              message(STATUS "GIMI Android build")
              message(STATUS "ANDROID_ABI=${ANDROID_ABI}")
              message(STATUS "ANDROID_PLATFORM=${ANDROID_PLATFORM}")
              message(STATUS "CMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE}")
              message(STATUS "==========================================")
          endif()
          '''

          if "GIMI Android build" not in s:
              s = s.replace(
                  project_marker,
                  project_marker + android_block,
                  1
              )

          p.write_text(s)

          print("CMakeLists.txt patched successfully.")
          PY

          echo
          echo "=========================================="
          echo "CMake targets"
          echo "=========================================="

          grep -nE \
            "add_library|add_executable|target_link_libraries|ANDROID" \
            CMakeLists.txt \
            || true


      # ==========================================================
      # 8. Create Android Gradle configuration
      #
      # We intentionally DO NOT use the repository's
      # android/gradlew.
      #
      # GitHub Actions installs Gradle directly.
      # ==========================================================

      - name: Configure Android Gradle project
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GIMI-Launcher"

          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF


          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

          android.useAndroidX=true
          android.nonTransitiveRClass=true

          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.vfs.watch=false
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "com.gimi.launcher"

              compileSdk 36

              defaultConfig {
                  applicationId "com.gimi.launcher"

                  minSdk 29
                  targetSdk 36

                  versionCode 4
                  versionName "1.2.0"

                  ndk {
                      abiFilters "arm64-v8a"
                  }

                  externalNativeBuild {
                      cmake {
                          arguments \
                              "-DANDROID_STL=c++_static", \
                              "-DCMAKE_CXX_STANDARD=20", \
                              "-DCMAKE_BUILD_TYPE=Release"

                          targets "gimi_arm64"
                      }
                  }
              }

              applicationVariants.all { variant ->
                  variant.outputs.all {
                      outputFileName = 'GIMI 原神模组加载器.apk'
                  }
              }

              buildTypes {
                  debug {
                      debuggable true
                      minifyEnabled false
                  }

                  release {
                      debuggable false
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "../CMakeLists.txt"
                      version "3.22.1"
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }

                  resources {
                      excludes += [
                          "META-INF/LICENSE*",
                          "META-INF/NOTICE*"
                      ]
                  }
              }
          }

          dependencies {
              implementation "androidx.core:core:1.13.1"

              implementation "dev.rikka.shizuku:api:13.1.5"
              implementation "dev.rikka.shizuku:provider:13.1.5"
          }
          EOF


      # ==========================================================
      # 9. Normalize AndroidManifest
      # ==========================================================

      - name: Normalize AndroidManifest
        shell: bash
        run: |
          set -euxo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
              echo "ERROR: AndroidManifest.xml not found"
              exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/AndroidManifest.xml")

          s = p.read_text()

          # Remove explicit uses-sdk declarations.
          # SDK versions are controlled by Gradle.

          s = re.sub(
              r'\s*<uses-sdk\b[^>]*/>',
              '',
              s
          )

          p.write_text(s)

          print("AndroidManifest normalized.")
          PY

          echo
          cat "$MANIFEST"


      # ==========================================================
      # 10. Setup Gradle
      #
      # IMPORTANT:
      #
      # We DO NOT call:
      #
      # ./android/gradlew
      #
      # We DO NOT download:
      #
      # gradle-8.2.2-bin.zip
      #
      # GitHub Actions installs Gradle 8.5 directly.
      # ==========================================================

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"


      # ==========================================================
      # 11. Verify Gradle
      # ==========================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "Gradle version"
          echo "=========================================="

          gradle --version

          echo
          echo "=========================================="
          echo "Gradle tasks"
          echo "=========================================="

          gradle tasks \
            --no-daemon \
            --stacktrace


      # ==========================================================
      # 12. Build Debug APK
      # ==========================================================

      - name: Build ARM64 Debug APK
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "BUILD GIMI ARM64 APK"
          echo "=========================================="

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ==========================================================
      # 13. Find APK
      # ==========================================================

      - name: Find generated APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "Generated APK"
          echo "=========================================="

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          echo
          echo "=========================================="
          echo "Generated native libraries"
          echo "=========================================="

          find app/build \
            -type f \
            -name "*.so" \
            -print \
            | grep "arm64-v8a" \
            || true


      # ==========================================================
      # 14. Verify APK
      # ==========================================================

      - name: Verify ARM64 APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="$(find \
            app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
              echo "ERROR: APK not found!"
              exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo
          echo "=========================================="
          echo "APK contents"
          echo "=========================================="

          unzip -l "$APK" \
            | grep -E \
              "lib/arm64-v8a/|AndroidManifest.xml" \
            || true

          echo
          echo "=========================================="
          echo "Check ARM64"
          echo "=========================================="

          if unzip -l "$APK" \
              | grep -q "lib/arm64-v8a/"; then

              echo "ARM64-v8a library detected."

          else

              echo "ERROR: ARM64-v8a library NOT found!"
              exit 1

          fi

          echo
          echo "=========================================="
          echo "APK size"
          echo "=========================================="

          ls -lh "$APK"


      # ==========================================================
      # 15. APK metadata
      # ==========================================================

      - name: Dump APK metadata
        shell: bash
        run: |
          set +e

          APK="$(find \
            app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          AAPT="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"

          if [ -x "$AAPT" ]; then
              "$AAPT" dump badging "$APK"
          fi


      # ==========================================================
      # 16. Upload APK
      # ==========================================================

      - name: Upload GIMI ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: GIMI 原神模组加载器
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 17. Upload native library
      # ==========================================================

      - name: Upload GIMI ARM64 native library
        uses: actions/upload-artifact@v4
        with:
          name: GIMI-libgimi-arm64
          path: |
            app/build/intermediates/cmake/**/obj/arm64-v8a/*.so
          if-no-files-found: warn
          retention-days: 30
